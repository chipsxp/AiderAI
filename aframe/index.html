<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame VR Experience</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="js/main.js"></script>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <a-scene>
      <!-- Environment -->
      <a-sky color="#ECECEC"></a-sky>
      
      <!-- Primitive shapes -->
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" class="interactive"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E" class="interactive"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D" class="interactive"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      
      <!-- Camera and cursor -->
      <a-entity position="0 1.6 0">
        <a-camera>
          <a-cursor color="#FAFAFA"></a-cursor>
        </a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
